<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Тести графіка</title>
<style>
  body { font: 15px/1.5 system-ui, "Segoe UI", sans-serif; margin: 20px; background: #0b0e11; color: #eaecef; }
  h1 { font-size: 20px; } h2 { font-size: 16px; margin: 18px 0 6px; color: #f0b90b; }
  .ok { color: #2ebd85; } .fail { color: #f6465d; font-weight: 700; } .note { color: #9aa4b2; }
  #sum { font-size: 18px; font-weight: 700; margin: 10px 0; } li { margin: 2px 0; } code { color: #f0b90b; }
</style>
</head>
<body>
<h1>Тести графіка (chart-indicators.js, chart-data.js)</h1>
<p class="note">Відкрийте цей файл через локальний сервер (start-site.bat) за адресою /tools/test-chart.html. Мережа й біржа не потрібні: WebSocket, fetch і таймери підмінені. Node.js не потрібен.</p>
<div id="sum">Виконується…</div>
<div id="out"></div>

<script src="../chart-indicators.js"></script>
<script src="../chart-scale.js"></script>
<script src="../chart-layout.js"></script>
<script src="../chart-data.js"></script>
<script src="../agent-ui.js"></script>
<script src="../chart-tool.js"></script>
<script>
(function () {
  const out = document.getElementById("out");
  let section = null, pass = 0, fail = 0;
  const queue = [];

  function group(name) { queue.push({ group: name }); }
  function test(name, fn) { queue.push({ name: name, fn: fn }); }
  function Skip(msg) { this.message = msg; }
  let skipped = 0;
    function assert(cond, msg) { if (!cond) throw new Error(msg || "перевірка не пройшла"); }
  function eq(a, b, msg) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((msg || "значення різні") + ": очікували " + JSON.stringify(b) + ", отримали " + JSON.stringify(a)); }
  function near(a, b, eps, msg) { if (a === null || b === null || Math.abs(a - b) > (eps || 1e-9)) throw new Error((msg || "значення різні") + ": очікували ≈" + b + ", отримали " + a); }

  // ---------- Підміна середовища: таймери, час, fetch, WebSocket ----------
  function fakeEnv(opts) {
    opts = opts || {};
    const env = { now: 1000000, timers: [], seq: 0, sockets: [], fetches: [], fetchImpl: null, delays: [] };
    env.setTimeout = function (fn, ms) { const id = ++env.seq; env.timers.push({ id: id, at: env.now + ms, fn: fn, ms: ms }); env.delays.push(ms); return id; };
    env.clearTimeout = function (id) { env.timers = env.timers.filter(function (t) { return t.id !== id; }); };
    env.advance = function (ms) {
      const end = env.now + ms;
      for (;;) {
        const due = env.timers.filter(function (t) { return t.at <= end; }).sort(function (a, b) { return a.at - b.at; })[0];
        if (!due) break;
        env.timers = env.timers.filter(function (t) { return t !== due; });
        env.now = due.at; due.fn();
      }
      env.now = end;
    };
    env.fetch = function (url) {
      env.fetches.push(url);
      return env.fetchImpl ? env.fetchImpl(url) : Promise.resolve({ ok: true, json: function () { return Promise.resolve([]); } });
    };
    function FakeWS(url) {
      this.url = url; this.readyState = 0; this.sent = []; env.sockets.push(this);
    }
    FakeWS.prototype.send = function (s) { this.sent.push(JSON.parse(s)); };
    FakeWS.prototype.close = function () { this.readyState = 3; this.closedByClient = true; };
    FakeWS.prototype.open = function () { this.readyState = 1; if (this.onopen) this.onopen(); };
    FakeWS.prototype.message = function (obj) { if (this.onmessage) this.onmessage({ data: JSON.stringify(obj) }); };
    FakeWS.prototype.drop = function () { this.readyState = 3; if (this.onclose) this.onclose(); };
    env.WS = FakeWS;
    env.data = ChartData.create({
      fetch: env.fetch, WebSocket: FakeWS, setTimeout: env.setTimeout, clearTimeout: env.clearTimeout,
      random: function () { return 0.5; },                 // 0,5 → відхилення 0: затримки передбачувані
      now: function () { return env.now; }, hosts: opts.hosts || ["https://h1", "https://h2"], wsUrl: "wss://fake/ws", autoResume: false,
    });
    return env;
  }
  const row = function (t, c) { return [t, String(c), String(c + 1), String(c - 1), String(c), "10"]; };
  function okFetch(rows) { return function () { return Promise.resolve({ ok: true, json: function () { return Promise.resolve(rows); } }); }; }
  const kmsg = function (sym, interval, t, c, closed) { return { e: "kline", E: 1, s: sym + "USDT", k: { t: t, i: interval, o: String(c), h: String(c + 1), l: String(c - 1), c: String(c), v: "5", x: !!closed } }; };
  const tick = function () { return new Promise(function (r) { setTimeout(r, 0); }); };

  // =============== Індикатори ===============
  const I = ChartIndicators;
  group("Індикатори: SMA, EMA, RSI, Bollinger, MACD, кеш");
  test("SMA: [1..5], n=3 → [null,null,2,3,4]", function () { eq(I.sma([1, 2, 3, 4, 5], 3), [null, null, 2, 3, 4]); });
  test("SMA: ряд коротший за період → усі null", function () { eq(I.sma([1, 2], 5), [null, null]); });
  test("EMA: стала послідовність дає ту саму сталу", function () { const e = I.ema([5, 5, 5, 5, 5, 5], 3); eq(e.slice(0, 2), [null, null]); e.slice(2).forEach(function (v) { near(v, 5); }); });
  test("EMA(3) для [1..6]: перше значення — SMA(1,2,3)=2, далі k=0,5", function () { const e = I.ema([1, 2, 3, 4, 5, 6], 3); near(e[2], 2); near(e[3], 3); near(e[4], 4); near(e[5], 5); });
  test("RSI: ціна тільки росте → 100", function () { const a = []; for (let i = 1; i <= 30; i++) a.push(i); near(I.rsi(a, 14)[20], 100); });
  test("RSI: ціна тільки падає → 0", function () { const a = []; for (let i = 30; i >= 1; i--) a.push(i); near(I.rsi(a, 14)[20], 0); });
  test("RSI збігається з незалежним еталонним розрахунком на «пилці»", function () {
    const a = []; let p = 100; for (let i = 0; i < 60; i++) { p += Math.sin(i * 1.3) * 2 + (i % 7 === 0 ? -3 : 1); a.push(p); }
    const r = I.rsi(a, 14);
    // еталон: окремі масиви приростів і ковзні середні за Вайлдером
    const gain = [0], loss = [0]; for (let i = 1; i < a.length; i++) { const d = a[i] - a[i - 1]; gain.push(Math.max(d, 0)); loss.push(Math.max(-d, 0)); }
    let ag = 0, al = 0; for (let i = 1; i <= 14; i++) { ag += gain[i]; al += loss[i]; } ag /= 14; al /= 14;
    for (let i = 15; i < a.length; i++) { ag = (ag * 13 + gain[i]) / 14; al = (al * 13 + loss[i]) / 14; }
    near(r[a.length - 1], 100 - 100 / (1 + ag / al), 1e-9);
    eq(r.slice(0, 14).every(function (v) { return v === null; }), true, "до індексу 14 значень немає");
  });
  test("Bollinger: стала послідовність → смуги збігаються з середньою", function () { const b = I.bollinger([4, 4, 4, 4, 4, 4], 3, 2); near(b.up[5], 4); near(b.dn[5], 4); near(b.mid[5], 4); });
  test("Bollinger: [1..5], n=5, k=2 → середня 3, смуги 3±2·√2", function () { const b = I.bollinger([1, 2, 3, 4, 5], 5, 2); near(b.mid[4], 3); near(b.up[4], 3 + 2 * Math.SQRT2); near(b.dn[4], 3 - 2 * Math.SQRT2); });
  test("MACD: лінія = EMA12 − EMA26, гістограма = лінія − сигнал", function () {
    const a = []; for (let i = 0; i < 80; i++) a.push(100 + Math.sin(i / 4) * 5 + i * 0.1);
    const m = I.macd(a), e12 = I.ema(a, 12), e26 = I.ema(a, 26);
    for (let i = 25; i < a.length; i++) near(m.macd[i], e12[i] - e26[i], 1e-9, "лінія на " + i);
    eq(m.macd[24], null, "лінія з'являється з індексу 25"); eq(m.signal[32], null, "сигнал з'являється через 9 значень лінії"); near(m.hist[40], m.macd[40] - m.signal[40], 1e-9);
    near(m.signal[33] !== null ? 1 : 0, 1);
  });
  test("Індикатори не змінюють вхідний масив", function () { const a = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8, 9, 7, 9, 3, 2, 3, 8, 4]; const c = a.slice(); I.sma(a, 3); I.ema(a, 3); I.rsi(a, 5); I.bollinger(a, 5, 2); I.macd(a, 3, 6, 3); eq(a, c); });
  test("Кеш: той самий ключ і версія → обчислення один раз; нова версія → перерахунок", function () {
    const c = I.cache(); let n = 0; const f = function () { n++; return [n]; };
    const a = c.get("sma", 1, f), b = c.get("sma", 1, f); assert(a === b && n === 1, "повторний виклик не повинен рахувати");
    c.get("sma", 2, f); eq(n, 2); c.get("rsi", 2, f); eq(n, 3, "інший ключ рахується окремо");
  });


  // =============== Цінова шкала (чиста математика) ===============
  const SC = ChartScale;
  group("Цінова шкала: lin / log / %, діапазони, позначки осі");
  test("fwd і inv — взаємно обернені в усіх режимах", function () {
    [["lin", 0], ["log", 0]].forEach(function (m) { [0.00001234, 1.5, 83250.75, 1e6].forEach(function (p) { near(SC.inv(m[0], SC.fwd(m[0], p, m[1]), m[1]), p, p * 1e-12, m[0] + " " + p); }); });
    [40000, 79999.99, 83250.75, 160000].forEach(function (p) { near(SC.inv("pct", SC.fwd("pct", p, 80000), 80000), p, p * 1e-12, "pct " + p); });
  });
  test("lin: ціна не змінюється; pct: база = 0 %, подвоєння = +100 %, падіння вдвічі = −50 %", function () {
    eq(SC.fwd("lin", 123.4, 0), 123.4); near(SC.fwd("pct", 100, 100), 0); near(SC.fwd("pct", 200, 100), 100); near(SC.fwd("pct", 50, 100), -50);
  });
  test("log: однакові відсоткові рухи дають однакову відстань на шкалі", function () {
    const d1 = SC.fwd("log", 200, 0) - SC.fwd("log", 100, 0), d2 = SC.fwd("log", 20000, 0) - SC.fwd("log", 10000, 0); near(d1, d2, 1e-12);
    const lin1 = 200 - 100, lin2 = 20000 - 10000; assert(lin1 !== lin2, "у lin вони різні");
  });
  test("Режими монотонні: більша ціна — більша координата", function () { ["lin", "log", "pct"].forEach(function (m) { let prev = -Infinity; [1, 2, 5, 10, 100, 1000].forEach(function (p) { const t = SC.fwd(m, p, 10); assert(t > prev, m + " не монотонний"); prev = t; }); }); });
  test("canUse: log і % вимагають додатних цін; lin завжди можна", function () {
    eq(SC.canUse("lin", -5, 0), true); eq(SC.canUse("log", 0, 1), false); eq(SC.canUse("log", 0.0001, 1), true); eq(SC.canUse("pct", 5, 0), false); eq(SC.canUse("pct", 5, 10), true);
  });
  test("autoRange: lin додає відступ 8 % діапазону з обох боків; для pct діапазон у відсотках; стала ціна розширюється", function () {
    const r = SC.autoRange("lin", 100, 200, 0, 0.08); near(r.lo, 92); near(r.hi, 208);
    const q = SC.autoRange("pct", 90, 110, 100, 0.1); near(q.lo, -12); near(q.hi, 12);
    const f = SC.autoRange("lin", 100, 100, 0, 0.08); assert(f.hi > f.lo, "діапазон не нульовий");
  });
  test("zoomRange тримає центр; panRange зсуває без зміни розміру; мінімальний розмір не нульовий", function () {
    const r = SC.zoomRange({ lo: 10, hi: 30 }, 0.5); near((r.lo + r.hi) / 2, 20); near(r.hi - r.lo, 10);
    const p = SC.panRange({ lo: 10, hi: 30 }, 5); eq([p.lo, p.hi], [15, 35]);
    const z = SC.zoomRange({ lo: 10, hi: 30 }, 0); assert(z.hi > z.lo, "не схлопується в точку");
  });
  test("ticks lin: «круглі» значення в межах діапазону", function () {
    const t = SC.ticks("lin", 82100, 83900, 0, 5); assert(t.length >= 3 && t.length <= 9, "кількість " + t.length);
    t.forEach(function (k) { assert(k.t >= 82100 && k.t <= 83900, "у межах"); near(k.t % 100, 0, 1e-6, "кратне кроку"); });
  });
  test("ticks pct: «круглі» відсотки навколо нуля", function () { const t = SC.ticks("pct", -3.2, 4.1, 100, 5); assert(t.some(function (k) { return k.v === 0; }), "є нуль"); t.forEach(function (k) { near(k.t, k.v); }); });
  test("ticks log: вузький діапазон — рівні ціни; широкий (понад 8×) — степені 10 із 1/2/5; позиції = ln(ціни)", function () {
    const a = SC.ticks("log", Math.log(80000), Math.log(90000), 0, 5); a.forEach(function (k) { near(k.t, Math.log(k.v), 1e-12); assert(k.v >= 80000 && k.v <= 90000); }); assert(a.length >= 2);
    const b = SC.ticks("log", Math.log(1), Math.log(1000), 0, 5); eq(b.map(function (k) { return k.v; }), [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000]);
  });
  test("ticks lin: дрібні ціни не дають похибок плаваючої коми (0,00001234…)", function () {
    const t = SC.ticks("lin", 0.0000120, 0.0000130, 0, 5); t.forEach(function (k) { assert(/^\d\.\d+e-5$|^0\.0000\d+$/.test(String(k.v)) || k.v.toFixed(8) === String(+k.v.toFixed(8)), "значення " + k.v); });
  });

  // =============== Точність цін ===============
  group("Точність цін: правила біржі (tickSize) і оцінка за даними");
  test("decimalsFromTick: 0.01000000 → 2, 1.00000000 → 0, 0.00000001 → 8, 0.00001000 → 5", function () {
    const f = ChartData.decimalsFromTick; eq(f("0.01000000"), 2); eq(f("1.00000000"), 0); eq(f("0.00000001"), 8); eq(f("0.00001000"), 5); eq(f(0.5), 1);
  });
  test("parseSymbolInfo: tickSize із PRICE_FILTER; нульовий tickSize чи немає фільтра → null", function () {
    const ok = ChartData.parseSymbolInfo({ symbols: [{ filters: [{ filterType: "LOT_SIZE", stepSize: "0.00001000" }, { filterType: "PRICE_FILTER", tickSize: "0.01000000" }] }] });
    eq(ok.tickSize, 0.01); eq(ok.decimals, 2); eq(ok.stepSize, 0.00001); eq(ok.source, "exchange");
    eq(ChartData.parseSymbolInfo({ symbols: [{ filters: [{ filterType: "PRICE_FILTER", tickSize: "0.00000000" }] }] }), null);
    eq(ChartData.parseSymbolInfo({ symbols: [{ filters: [] }] }), null); eq(ChartData.parseSymbolInfo({}), null); eq(ChartData.parseSymbolInfo(null), null);
  });
  test("inferDecimals: оцінка за цінами без помилок плаваючої коми", function () {
    const f = ChartData.inferDecimals; eq(f([82869.99, 82870, 82871.5]), 2); eq(f([1.4036, 1.4048, 1.4]), 4); eq(f([0.00001234, 0.0000125]), 8); eq(f([100, 200]), 0); eq(f([0.1 + 0.2]), 1);
  });
  test("roundToTick: ціна кратна кроку без «хвостів»", function () { const r = ChartData.roundToTick; eq(r(82869.987, 0.01), 82869.99); eq(r(0.123456, 0.00001), 0.12346); eq(r(7.4, 0.5), 7.5); eq(r(5, 0), 5); });
  test("symbolInfo: один запит на монету (кеш), перша адреса не відповіла → друга; невдача не кешується", async function () {
    const env = fakeEnv(); let n = 0;
    env.fetchImpl = function (u) { n++; if (/h1/.test(u)) return Promise.resolve({ ok: false, status: 500 }); return Promise.resolve({ ok: true, json: function () { return Promise.resolve({ symbols: [{ filters: [{ filterType: "PRICE_FILTER", tickSize: "0.00001000" }] }] }); } }); };
    const [a, b] = await Promise.all([env.data.symbolInfo("DOGE"), env.data.symbolInfo("DOGE")]); eq(a.decimals, 5); eq(b.decimals, 5); eq(n, 2, "h1 + h2, один раз");
    await env.data.symbolInfo("DOGE"); eq(n, 2, "із кешу");
    const e2 = fakeEnv(); e2.fetchImpl = function () { return Promise.reject(new Error("мережа")); }; eq(await e2.data.symbolInfo("BTC"), null);
    e2.fetchImpl = function () { return Promise.resolve({ ok: true, json: function () { return Promise.resolve({ symbols: [{ filters: [{ filterType: "PRICE_FILTER", tickSize: "0.01" }] }] }); } }); };
    eq((await e2.data.symbolInfo("BTC")).decimals, 2, "після невдачі запит повторюється");
  });

  // =============== Нормалізація даних ===============
  const D = ChartData;
  group("Нормалізація й об'єднання свічок");
  test("normalizeRow: рядки Binance → числа", function () { const c = D.normalizeRow([1700000000000, "10.5", "11", "10", "10.8", "123.4", 0]); eq(c, { t: 1700000000000, o: 10.5, h: 11, l: 10, c: 10.8, v: 123.4 }); });
  test("normalizeRow: сміття (NaN, порожнє, без часу) → null", function () { eq(D.normalizeRow(null), null); eq(D.normalizeRow([0, "1", "1", "1", "1", "1"]), null, "час 0"); eq(D.normalizeRow([5, "x", "1", "1", "1", "1"]), null, "NaN у ціні"); eq(D.normalizeRow({ t: 5, o: 1, h: 1, l: 1 }), null, "немає закриття"); });
  test("normalizeSeries: сортує за часом і прибирає дублі (остання перемагає)", function () {
    const s = D.normalizeSeries([row(3000, 3), row(1000, 1), row(2000, 2), row(2000, 22), [9, "bad"], row(1000, 11)]);
    eq(s.map(function (c) { return c.t; }), [1000, 2000, 3000]); eq(s.map(function (c) { return c.c; }), [11, 22, 3]);
  });
  test("merge: оновлена остання свічка замінює стару, а не додається", function () {
    const base = D.normalizeSeries([row(1000, 1), row(2000, 2)]);
    const m = D.merge(base, [{ t: 2000, o: 2, h: 9, l: 1, c: 8, v: 1 }, { t: 3000, o: 8, h: 8, l: 8, c: 8, v: 1 }]);
    eq(m.length, 3); eq(m[1].c, 8); eq(m.map(function (c) { return c.t; }), [1000, 2000, 3000]);
  });
  test("prependOlder: додає лише строго старіші; повторне додавання нічого не змінює", function () {
    const all = D.normalizeSeries([row(3000, 3), row(4000, 4)]);
    const r1 = D.prependOlder(all, D.normalizeSeries([row(1000, 1), row(2000, 2), row(3000, 33)]));
    eq(r1.added, 2); eq(r1.all.map(function (c) { return c.t; }), [1000, 2000, 3000, 4000]); eq(r1.all[2].c, 3, "наявна свічка 3000 не перезаписується старою");
    const r2 = D.prependOlder(r1.all, D.normalizeSeries([row(1000, 1), row(2000, 2)])); eq(r2.added, 0); eq(r2.all.length, 4);
  });

  // =============== Завантаження: подвійні запити ===============
  group("Завантаження свічок: кеш і об'єднання запитів (подвійне завантаження)");
  test("Два однакові запити одночасно → ОДИН запит до біржі", async function () {
    const env = fakeEnv(); env.fetchImpl = okFetch([row(1000, 1), row(2000, 2)]);
    const [a, b] = await Promise.all([env.data.fetchKlines("BTC", "1h"), env.data.fetchKlines("BTC", "1h")]);
    eq(env.fetches.length, 1, "кількість запитів"); eq(a.length, 2); eq(b.length, 2);
    a[0].c = 999; assert(b[0].c !== 999, "кожен отримувач має власну копію");
  });
  test("Повторний запит у межах кешу → без нового запиту; після закінчення кешу → новий", async function () {
    const env = fakeEnv(); env.fetchImpl = okFetch([row(1000, 1)]);
    await env.data.fetchKlines("ETH", "1h"); await env.data.fetchKlines("ETH", "1h"); eq(env.fetches.length, 1);
    env.now += env.data.CFG.ttlMs + 1; await env.data.fetchKlines("ETH", "1h"); eq(env.fetches.length, 2);
  });
  test("Інша монета чи інтервал → окремі запити (не змішуються)", async function () {
    const env = fakeEnv(); env.fetchImpl = okFetch([row(1000, 1)]);
    await Promise.all([env.data.fetchKlines("BTC", "1h"), env.data.fetchKlines("ETH", "1h"), env.data.fetchKlines("BTC", "15m")]);
    eq(env.fetches.length, 3); assert(env.fetches.some(function (u) { return /symbol=ETHUSDT&interval=1h/.test(u); }) && env.fetches.some(function (u) { return /symbol=BTCUSDT&interval=15m/.test(u); }));
  });
  test("Перше джерело не відповіло → береться друге", async function () {
    const env = fakeEnv(); env.fetchImpl = function (u) { return /h1/.test(u) ? Promise.resolve({ ok: false, status: 503 }) : okFetch([row(1000, 1)])(); };
    const r = await env.data.fetchKlines("BTC", "1h"); eq(r.length, 1); eq(env.fetches.length, 2);
  });
  test("Усі джерела недоступні → помилка, а невдалий результат НЕ кешується", async function () {
    const env = fakeEnv(); env.fetchImpl = function () { return Promise.reject(new Error("мережа")); };

  async function untilFrames(cond, maxFrames) { for (let i = 0; i < (maxFrames || 120); i++) { if (cond()) return true; await frames(1); } return cond(); }
  async function until(cond, ms) { const end = Date.now() + (ms || 1500); while (Date.now() < end) { if (cond()) return true; await sleep(30); } return cond(); }

  // Незалежна реалізація EMA «в лоб»: за означенням, з рекурсією від початку (SMA-початок + k)

    c.inst.close(); eq(env.data._state().subs, [], "підписку знято"); c.host.remove(); clearInd();
  });
  test("Вузький екран (360 px): панель індикаторів не розширює сторінку, графік із двома підпанелями вміщається", async function () {
    clearInd(); const env = fakeEnv(); env.fetchImpl = okFetch(hours(T0, 500)); setLayout(function (l) { LY.add(l, "macd"); LY.update(l, "rsi", { visible: true }); LY.add(l, "ema"); });
    const c = mountChart(env); c.host.style.width = "360px"; await until(function () { return c.candles() > 0; }); gear(c.host).click(); await sleep(150);
    assert(c.host.scrollWidth <= 361, "горизонтальної прокрутки немає: " + c.host.scrollWidth); const vb = c.svg().viewBox.baseVal; const bg = c.host.querySelectorAll(".ct-rsi-bg"); eq(bg.length, 2);
    bg.forEach(function (r) { assert(parseFloat(r.getAttribute("height")) >= 30, "панель не стиснута до нуля"); assert(parseFloat(r.getAttribute("y")) + parseFloat(r.getAttribute("height")) <= vb.height, "панель у межах полотна"); });
    c.inst.close(); c.host.remove(); clearInd();
  });
  test("Ряди без свічок (лінійний графік серії): індикатори вимкнені, кнопка керування не ламає відображення", async function () {
    clearInd(); const host = document.createElement("div"); host.style.width = "700px"; document.body.appendChild(host);
    const pts = []; for (let i = 0; i < 80; i++) pts.push({ t: T0 + i * 86400000, c: 100 + (i % 9) });
    const inst = ChartTool.mount(host, { title: "Серія", points: pts }); await sleep(150); assert(host.querySelector(".ct-svg"), "графік намальовано"); eq(host.querySelectorAll(".ct-vwap, .ct-macd-line, .ct-rsi-line").length, 0); inst.close(); host.remove(); clearInd();
  });

  // =============== Запуск ===============
  async function run() {
    for (const item of queue) {
      if (item.group) { section = document.createElement("div"); const h = document.createElement("h2"); h.textContent = item.group; section.appendChild(h); section.appendChild(document.createElement("ul")); out.appendChild(section); continue; }
      const li = document.createElement("li");
      try { await item.fn(); pass++; li.className = "ok"; li.textContent = "✓ " + item.name; }
      catch (e) {
        if (e instanceof Skip) { skipped++; li.className = "note"; li.textContent = "○ " + item.name + " — не автоматизовано тут: " + e.message; }
        else { fail++; li.className = "fail"; li.textContent = "✗ " + item.name + " — " + (e && e.message ? e.message : e); }
      }
      section.querySelector("ul").appendChild(li);
    }
    const total = pass + fail, s = document.getElementById("sum");
    s.textContent = (fail ? "Провалено: " + fail + " із " + total : "Усі тести пройдено: " + pass + " із " + total) + (skipped ? " (пропущено, потрібна видима вкладка: " + skipped + ")" : "");
    s.className = fail ? "fail" : "ok";
    document.title = (fail ? "ПРОВАЛ " : "OK ") + pass + "/" + total;
    window.__testSummary = { pass: pass, fail: fail, skipped: skipped, total: total };
  }

  const notes = document.createElement("div");
  notes.innerHTML = "<h2>Що НЕ перевіряється автоматично</h2><ul class='note'><li>Реальні відповіді й обриви біржі Binance (потрібна мережа): перевіряється вручну в браузері.</li><li>Малювання графіка, ResizeObserver, дотик і pinch на справжньому телефоні, швидкодія кадрів: лише вручну.</li><li>Інструменти малювання, збереження ліній, маркери B/S: огляд у браузері на сторінках сайту.</li></ul>";
  document.body.appendChild(notes);
  run();
})();
