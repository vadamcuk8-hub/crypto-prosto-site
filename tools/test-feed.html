<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Тести живої стрічки</title>
<style>
  body { font: 15px/1.5 system-ui, "Segoe UI", sans-serif; margin: 20px; background: #0b0e11; color: #eaecef; }
  h1 { font-size: 20px; } h2 { font-size: 16px; margin: 18px 0 6px; color: #f0b90b; }
  .ok { color: #2ebd85; } .fail { color: #f6465d; font-weight: 700; } .note { color: #9aa4b2; }
  #sum { font-size: 18px; font-weight: 700; margin: 10px 0; } li { margin: 2px 0; }
</style>
</head>
<body>
<h1>Тести живої стрічки подій (live-feed-core.js, live-feed.js)</h1>
<p class="note">Відкрийте через локальний сервер: /tools/test-feed.html. Мережа не потрібна: fetch, WebSocket, таймери, сховище й звук підмінені. Запуск без Node.js: <code>python tools/run_chart_tests.py test-feed.html</code>.</p>
<div id="sum">Виконується…</div>
<div id="out"></div>
<script src="../agent-ui.js"></script>
<script src="../live-feed-core.js"></script>
<script src="../live-feed.js"></script>
<script>
(function () {
  const out = document.getElementById("out"), queue = [];
  let section = null, pass = 0, fail = 0, skipped = 0;
  function group(n) { queue.push({ group: n }); }
  function test(n, fn) { queue.push({ name: n, fn: fn }); }
  function Skip(m) { this.message = m; }
  function assert(c, m) { if (!c) throw new Error(m || "перевірка не пройшла"); }
  function eq(a, b, m) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((m || "значення різні") + ": очікували " + JSON.stringify(b) + ", отримали " + JSON.stringify(a)); }
  function near(a, b, e, m) { if (a === null || b === null || Math.abs(a - b) > (e || 1e-9)) throw new Error((m || "значення різні") + ": очікували ≈" + b + ", отримали " + a); }
  const sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  const flush = async function () { for (let i = 0; i < 4; i++) await sleep(0); };
  const C = LiveFeedCore, NOW = Date.now();

  // ---------- Підміна середовища ----------
  function fakeEnv(opts) {
    opts = opts || {};
    const env = { now: function () { return env._now; }, _now: NOW, timers: [], seq: 0, sockets: [], fetches: [], delays: [], journalUrl: "data/live_feed.json", random: function () { return 0.5; }, beeps: [], journalBody: opts.journal || null, restBody: null, restFail: false, journalFail: false };
    const mem = {};
    env.mem = mem;
    env.storage = { getItem: function (k) { return k in mem ? mem[k] : null; }, setItem: function (k, v) { if (opts.storageFail) throw new Error("quota"); mem[k] = String(v); } };
    env.setTimeout = function (fn, ms) { const id = ++env.seq; env.timers.push({ id: id, at: env._now + ms, fn: fn }); env.delays.push(ms); return id; };
    env.clearTimeout = function (id) { env.timers = env.timers.filter(function (t) { return t.id !== id; }); };
    env.advance = function (ms) {
      const end = env._now + ms;
      for (;;) { const due = env.timers.filter(function (t) { return t.at <= end; }).sort(function (a, b) { return a.at - b.at; })[0]; if (!due) break; env.timers = env.timers.filter(function (t) { return t !== due; }); env._now = due.at; due.fn(); }
      env._now = end;
    };
    env.fetch = function (u) {
      env.fetches.push(u);
      if (/live_feed/.test(u)) {
        if (env.journalFail) return Promise.reject(new Error("мережа"));
        const b = env.journalBody;
        return Promise.resolve({ ok: b !== null, status: b === null ? 404 : 200, json: function () { return typeof b === "string" ? Promise.reject(new Error("не JSON")) : Promise.resolve(JSON.parse(JSON.stringify(b))); } });
      }
      if (/ticker\/price/.test(u)) {
        if (env.restFail) return Promise.reject(new Error("мережа"));
        return Promise.resolve({ ok: true, json: function () { return Promise.resolve(env.restBody || []); } });
      }
      return Promise.reject(new Error("невідомий запит " + u));
    };
    function WS(url) { this.url = url; this.readyState = 0; env.sockets.push(this); }
    WS.prototype.close = function () { this.readyState = 3; this.closedByClient = true; };
    WS.prototype.open = function () { this.readyState = 1; if (this.onopen) this.onopen(); };
    WS.prototype.price = function (sym, p) { if (this.onmessage) this.onmessage({ data: JSON.stringify({ data: { s: sym + "USDT", c: String(p) } }) }); };
    WS.prototype.drop = function () { this.readyState = 3; if (this.onclose) this.onclose(); };
    env.WebSocket = opts.noWS ? undefined : WS;
    env.AudioContext = function () { this.currentTime = 0; this.destination = {}; this.createOscillator = function () { const o = { frequency: { value: 0 }, connect: function () {}, start: function () { env.beeps.push(o.frequency.value); }, stop: function () {} }; return o; }; this.createGain = function () { return { gain: { value: 0 }, connect: function () {} }; }; this.resume = function () {}; };
    return env;
  }
  function tEvent(o) { return Object.assign({ id: "sim-" + Math.random().toString(36).slice(2), t: NOW - 60000, source: "sim", confirmed: "engine", type: "close", coin: "BNB", pair: "BNB/USDT", wallet: 1000, bot: "trend_1h", bot_title: "Trend Pro", direction: "LONG", price: 751.48, entry_price: 748.02, pnl_pct: 0.46, pnl_usd: 3.42, result: "profit", exit: "take", reason: "тест" }, o || {}); }
  function journal(events, open, extra) { return Object.assign({ v: 1, updated: new Date(NOW).toISOString(), policy: "Журнал, а не повна історія: старіші записи видаляються.", max_events: 1000, dropped: 0, fee: 0.0015, events: events || [], open: open || [] }, extra || {}); }
  function position(o) { return Object.assign({ pos: "p1", wallet: 1000, bot: "trend_1h", bot_title: "Trend Pro", coin: "BNB", pair: "BNB/USDT", direction: "LONG", entry: 100, entry_cost: 0.0015, entry_t: NOW - 1000 }, o || {}); }
  const CFG = { fee: 0.0015, near: 0.2, hyst: 0.05 };
  async function started(env) { const ctl = C.createController(env); ctl.start(); await flush(); return ctl; }

  // =============== Модель, категорії, фільтри ===============
  group("Модель подій, категорії й фільтри");
  test("Подія журналу перевіряється: сміття, невідомі типи й нечислові ціни відкидаються; Testnet і симуляція розрізняються", function () {
    assert(C.normTrade(tEvent()) && C.normTrade(tEvent({ source: "testnet", wallet: "testnet", confirmed: "exchange", order_id: "11" })), "добрі події");
    [null, 5, "x", {}, tEvent({ id: "" }), tEvent({ t: "вчора" }), tEvent({ source: "real" }), tEvent({ type: "buy" }), tEvent({ price: NaN }), tEvent({ wallet: "abc" })].forEach(function (b, i) { eq(C.normTrade(b), null, "сміття #" + i); });
    const a = C.normTrade(tEvent({ exit: "signal" })), b = C.normTrade(tEvent({ source: "testnet", wallet: "testnet", confirmed: "exchange", exit: "signal" }));
    assert(C.sourceLabel(a) === "Віртуальна угода" && C.sourceLabel(b) === "Binance Testnet" && C.sourceLabel({ source: "price" }) === "Цінова подія", "різні назви");
    assert(/не біржов/.test(C.sourceNote(a)) && /тестов/.test(C.sourceNote(b)) && /Оцінка за поточною ціною/.test(C.sourceNote({ source: "price" })), "різні пояснення");
    assert(C.title(b) !== C.title(a), "заголовки Testnet і симуляції різні");
  });
  test("Стартові позиції раунду не показуються в стрічці й не рахуються в лічильниках", async function () {
    const env = fakeEnv({ journal: journal([tEvent({ id: "i1", type: "open", initial: true, result: undefined, exit: undefined }), tEvent({ id: "c1" })]) }), ctl = await started(env);
    eq(ctl.state().items.map(function (x) { return x.id; }), ["c1"]); ctl.stop();
  });
  test("Результат Testnet не подається як точний чистий PnL (позначка в картці й пояснення в подробицях); результат симулятора позначено як модельний", async function () {
    const env = fakeEnv({ journal: journal([tEvent({ id: "tn", source: "testnet", wallet: "testnet", confirmed: "exchange", pnl_basis: "quote_diff", fees: { BNB: 0.001 } }), tEvent({ id: "sm", t: NOW - 5000, pnl_basis: "model" })]) }), u = await mountUI(env, { period: "all" });
    const cards = qa(u, ".lf-card"); assert(/без повного обліку комісій/.test(cards[1].textContent) && !/Реалізований результат/.test(cards[1].textContent), "Testnet: " + cards[1].textContent); assert(/Реалізований результат/.test(cards[0].textContent), "симулятор");
    cards[1].click(); assert(/не точний чистий PnL/.test(q(u, ".lf-detail").textContent), "пояснення в подробицях"); assert(C.normTrade(tEvent({ source: "testnet", wallet: "testnet", pnl_basis: "model" })).pnlExact === false, "навіть із полем model Testnet не вважається точним"); u.done();
  });
  test("Причина виходу: SL/TP лише за явним exit; unknown не стає Stop Loss; закриття без результату нейтральне", function () {
    const stop = C.normTrade(tEvent({ exit: "stop", result: "loss" })), unk = C.normTrade(tEvent({ exit: "unknown", result: "loss" })), noexit = C.normTrade(tEvent({ exit: undefined, result: "loss" }));
    eq(C.cats(stop), ["loss", "sltp"]); eq(C.cats(unk), ["loss"], "unknown — не SL/TP"); eq(C.cats(noexit), ["loss"], "немає поля — unknown"); assert(/Stop Loss/.test(C.title(stop)) && !/Stop Loss/.test(C.title(unk)));
    eq(C.cats(C.normTrade(tEvent({ result: "unknown", exit: "signal", pnl_usd: undefined }))), []); eq(C.cats(C.normTrade(tEvent({ type: "open", result: undefined, exit: undefined }))), []);
  });
  test("Цінові події: категорії беззбитковості, плюсу й мінусу; підпис «Оцінка»", function () {
    const mk = function (type) { return C.normInfo({ id: "px-" + type, t: NOW, type: type, coin: "BNB", price: 1, wallet: 1000, bot: "b" }); };
    eq(C.cats(mk("near_be")), ["be"]); eq(C.cats(mk("reached_be")), ["be"]); eq(C.cats(mk("to_plus")), ["profit"]); eq(C.cats(mk("to_minus")), ["loss"]);
    assert(mk("near_be").source === "price" && mk("near_be").confirmed === "estimate"); eq(C.normInfo({ id: "x", t: NOW, type: "sold", coin: "A", price: 1 }), null, "невідомий тип цінової події");
  });
  test("mergeItems: дедуплікація за ID, найновіші першими, стабільний порядок при однаковому часі", function () {
    const a = C.normTrade(tEvent({ id: "a", t: 5 })), b = C.normTrade(tEvent({ id: "b", t: 9 })), a2 = C.normTrade(tEvent({ id: "a", t: 5, price: 1 })), c = C.normTrade(tEvent({ id: "c", t: 9 }));
    const m = C.mergeItems([[a, b], [a2, c]]);
    eq(m.map(function (x) { return x.id; }), ["c", "b", "a"]); eq(m[2].price, a.price, "перший запис не перезаписується");
  });
  test("Фільтри комбінуються (пара + бот + гаманець + період + категорія); лічильники відповідають фактичним подіям", function () {
    const L = [
      tEvent({ id: "1", t: NOW - 600000 }), tEvent({ id: "2", t: NOW - 7200000, coin: "ETH", pair: "ETH/USDT", result: "loss", exit: "stop", pnl_usd: -1 }), tEvent({ id: "3", t: NOW - 90000000, wallet: 100, bot: "dca", result: "profit", exit: "signal" }),
      tEvent({ id: "4", t: NOW - 100, wallet: "testnet", source: "testnet", confirmed: "exchange", bot: "trend_1h", result: "loss", exit: "unknown", pnl_usd: -2 }),
    ].map(C.normTrade);
    const px = [C.normInfo({ id: "p1", t: NOW - 50, type: "near_be", coin: "BNB", price: 1, wallet: 1000, bot: "trend_1h" }), C.normInfo({ id: "p2", t: NOW - 40, type: "to_plus", coin: "BNB", price: 1, wallet: 1000, bot: "trend_1h" })];
    const all = C.mergeItems([L, px]);
    eq(C.counts(all, { period: "all" }, NOW), { all: 6, profit: 3, loss: 2, be: 1, sltp: 2 }, "усе");
    eq(C.counts(all, { period: "24h" }, NOW), { all: 5, profit: 2, loss: 2, be: 1, sltp: 2 }, "за 24 год немає події №3 (≈25 год)");
    eq(C.counts(all, { period: "1h" }, NOW).all, 4, "за годину: №1, №4 і дві цінові — без №2");
    eq(C.applyFilter(all, { period: "all", coin: "ETH" }, NOW).map(function (x) { return x.id; }), ["2"]);
    eq(C.applyFilter(all, { period: "all", wallet: 100 }, NOW).map(function (x) { return x.id; }), ["3"]);
    eq(C.applyFilter(all, { period: "all", wallet: "testnet" }, NOW).map(function (x) { return x.id; }), ["4"]);
    eq(C.applyFilter(all, { period: "all", bot: "trend_1h", cat: "loss" }, NOW).map(function (x) { return x.id; }).sort(), ["2", "4"]);
    eq(C.applyFilter(all, { period: "24h", bot: "trend_1h", wallet: 1000, coin: "BNB", cat: "be" }, NOW).map(function (x) { return x.id; }), ["p1"], "комбінація п'яти умов");
    eq(C.counts(all, { period: "all", coin: "BNB", cat: "loss" }, NOW).all, 5, "лічильники не залежать від вибраної категорії, лише від решти фільтрів");
  });

  // =============== Беззбитковість і цінові події ===============
  group("Беззбитковість і цінові сповіщення (LONG / SHORT, комісії, гістерезис)");
  test("Беззбитковість із чинної моделі витрат: LONG = ціна / ((1−вхід)(1−вихід)); збігається зі сторінкою «Симуляція» при однакових витратах; SHORT дзеркально", function () {
    near(C.beOf({ entry: 100, entry_cost: 0.0015, direction: "LONG" }, CFG), 100 / (0.9985 * 0.9985), 1e-9);
    near(C.beOf({ entry: 100, entry_cost: 0.0015, direction: "LONG" }, CFG), 100 / Math.pow(1 - 0.0015, 2), 1e-9, "як exitTargets: entry / (1−fee)²");
    near(C.beOf({ entry: 100, entry_cost: 0.0007, direction: "LONG" }, CFG), 100 / (0.9993 * 0.9985), 1e-9, "фактичні витрати входу з події");
    near(C.beOf({ entry: 100, direction: "LONG" }, CFG), 100 / Math.pow(1 - 0.0015, 2), 1e-9, "немає витрат входу — модель");
    near(C.beOf({ entry: 100, entry_cost: 0.0015, direction: "SHORT" }, CFG), 100 * 0.9985 * 0.9985, 1e-9);
    near(C.pnlPct({ entry: 100, direction: "SHORT" }, 90), 10, 1e-9); near(C.pnlPct({ entry: 100, direction: "LONG" }, 90), -10, 1e-9);
    assert(C.distBe({ direction: "LONG" }, 100.3, 100) > 0 && C.distBe({ direction: "LONG" }, 100.3, 101) < 0 && C.distBe({ direction: "SHORT" }, 99.7, 100) > 0 && C.distBe({ direction: "SHORT" }, 99.7, 99) < 0, "знак відстані");
  });
  test("Перший розрахунок запам'ятовує стан і не створює подій (нічого заднім числом), навіть якщо ціна вже за беззбитковістю чи в мінусі", function () {
    const p = position(), be = C.beOf(p, CFG);
    [be + 5, be - 0.01, 90, 100].forEach(function (price) { const r = C.evalPosition(p, price, undefined, CFG, NOW); eq(r.events, [], "baseline " + price); assert(r.st, "стан збережено"); });
  });
  test("Наближення до беззбитковості: одна подія при вході в зону 0,2 %; без повторів у зоні; повторно лише після виходу за 0,3 %", function () {
    const p = position(), be = C.beOf(p, CFG);
    let r = C.evalPosition(p, be * 0.99, undefined, CFG, NOW), st = r.st, ev = [];
    const bes = function () { return ev.filter(function (e) { return /_be$/.test(e.type); }); };
    const step = function (price) { r = C.evalPosition(p, price, st, CFG, NOW); st = r.st; ev = ev.concat(r.events); };
    step(be * 0.9975); eq(bes().length, 0, "ще поза зоною (0,25 %)");
    step(be * 0.9985); eq(bes().map(function (e) { return e.type; }), ["near_be"], "у зоні"); near(bes()[0].dist, 0.15, 0.02);
    for (let i = 0; i < 20; i++) step(be * (0.9984 + (i % 3) * 0.0003)); eq(bes().length, 1, "тремтіння в зоні не створює повторів");
    step(be * 0.9972); eq(bes().length, 1, "вихід із зони, але ще не за 0,3 %"); step(be * 0.9985); eq(bes().length, 1, "повернення в зону без виходу за 0,3 % — тиша");
    step(be * 0.996); step(be * 0.9985); eq(bes().map(function (e) { return e.type; }), ["near_be", "near_be"], "після виходу за 0,3 % — нова подія"); assert(bes()[0].id !== bes()[1].id, "різні ID");
  });
  test("Досягнення беззбитковості: перетин створює одну подію; гойдання навколо рівня не дублює; після відходу на 0,1 % вниз — нова", function () {
    const p = position(), be = C.beOf(p, CFG);
    let st = C.evalPosition(p, be * 0.99, undefined, CFG, NOW).st, ev = [];
    const step = function (price) { const r = C.evalPosition(p, price, st, CFG, NOW); st = r.st; ev = ev.concat(r.events); };
    const bes = function () { return ev.filter(function (e) { return /_be$/.test(e.type); }); };
    step(be * 1.0005); eq(bes().map(function (e) { return e.type; }), ["reached_be"], "перетин (з далекої зони одразу «досягнуто», без «наближення»)");
    for (let i = 0; i < 30; i++) step(be * (i % 2 ? 1.0004 : 0.9996)); eq(bes().length, 1, "гойдання ±0,04 % не дублює");
    step(be * 0.9985); step(be * 1.001); eq(ev.filter(function (e) { return e.type === "reached_be"; }).length, 2, "відхід нижче на >0,1 % і новий перетин");
    assert(new Set(ev.map(function (e) { return e.id; })).size === ev.length, "ID унікальні");
  });
  test("Перехід PnL через нуль: гістерезис ±0,05 %; подія лише при реальній зміні знака (мінус→плюс, плюс→мінус)", function () {
    const p = position();
    let st = C.evalPosition(p, 99.5, undefined, CFG, NOW).st, ev = [];
    const step = function (price) { const r = C.evalPosition(p, price, st, CFG, NOW); st = r.st; ev = ev.concat(r.events); };
    const pls = function () { return ev.filter(function (e) { return /^to_/.test(e.type); }); };
    step(100.02); step(99.98); step(100.03); eq(pls().length, 0, "дрібні коливання в смузі ±0,05 % мовчать");
    step(100.2); eq(pls().map(function (e) { return e.type; }), ["to_plus"]); near(pls()[0].pnlPct, 0.2, 1e-6);
    step(100.4); step(100.1); eq(pls().length, 1, "залишаємось у плюсі");
    step(99.8); eq(pls().map(function (e) { return e.type; }), ["to_plus", "to_minus"]); step(99.6); step(99.7); eq(pls().length, 2);
  });
  test("SHORT: падіння ціни — плюс, зростання — мінус; беззбитковість нижче входу", function () {
    const p = position({ direction: "SHORT" }), be = C.beOf(p, CFG);
    assert(be < p.entry, "BE нижче входу");
    let st = C.evalPosition(p, 101, undefined, CFG, NOW).st, ev = [];
    const step = function (price) { const r = C.evalPosition(p, price, st, CFG, NOW); st = r.st; ev = ev.concat(r.events); };
    step(99.5); eq(ev.filter(function (e) { return /^to_/.test(e.type); }).map(function (e) { return e.type; }), ["to_plus"], "SHORT у плюс при падінні");
    step(be * 1.0015); step(be * 0.999); assert(ev.some(function (e) { return e.type === "reached_be"; }), "досягнуто беззбитковості вниз"); step(100.5); assert(ev[ev.length - 1].type === "to_minus", "ріст — мінус");
  });
  test("Після «перезавантаження» (стан збережено й завантажено) старі сповіщення не повторюються; номери подій продовжуються", function () {
    const p = position(), be = C.beOf(p, CFG);
    let st = C.evalPosition(p, be * 0.99, undefined, CFG, NOW).st;
    let r = C.evalPosition(p, be * 1.001, st, CFG, NOW); st = JSON.parse(JSON.stringify(r.st)); eq(r.events.map(function (e) { return e.type; }), ["to_plus", "reached_be"]);
    r = C.evalPosition(p, be * 1.001, st, CFG, NOW); eq(r.events, [], "та сама ціна після перезавантаження — тиша");
    r = C.evalPosition(p, be * 0.9985, st, CFG, NOW); st = r.st; r = C.evalPosition(p, be * 1.002, st, CFG, NOW); assert(r.events.length === 1 && /reached_be-2$/.test(r.events[0].id), "лічильник продовжено: " + JSON.stringify(r.events.map(function (e) { return e.id; })));
  });

  // =============== Контролер: журнал, ціни, події ===============
  group("Контролер: журнал, дублікати, перезавантаження, живі ціни, звук");
  test("Завантаження журналу: події з'являються, порожній журнал не помилка, відсутність файлу — зрозумілий стан", async function () {

    q(u, ".lf-collapse").click(); assert(u.host.classList.contains("lf-collapsed") && u.root.classList.contains("lf-root-collapsed") && flag === true, "згорнуто"); assert(JSON.parse(env.mem["lf:prefs:v1"]).collapsed === true, "стан збережено");

  });
  test("Кнопка звуку: за замовчуванням вимкнено, перемикає стан і підпис, зберігає вибір", async function () {

  test("Висувне вікно (телефон): кнопка «Події» з лічильником у body, відкриває/закриває вікно, Esc закриває; destroy прибирає все", async function () {

  test("Спільна система: кілька панелей і повторні монтування не створюють додаткових сокетів, таймерів чи слухачів документа/вікна", async function () {
    const env = fakeEnv({ journal: journal([], [position()]) }), orig = EventTarget.prototype.addEventListener; let n = 0;
    EventTarget.prototype.addEventListener = function (t, f, o) { if (this === document || this === window) n++; return orig.call(this, t, f, o); };

  });

  // =============== Реальна розкладка сторінок (iframe зі справжніми стилями й скриптами) ===============
  group("Сторінка «Симуляція» зі стрічкою: комп'ютер, вужчий екран, телефон; сторінка «Ринок» без постійної панелі");
  function frame(page, w, h) {
    return new Promise(function (res) {
      const f = document.createElement("iframe"); f.style.cssText = "position:fixed;left:0;top:0;width:" + w + "px;height:" + (h || 900) + "px;border:0;opacity:0;pointer-events:none;z-index:-1"; f.src = "../" + page;
      f.onload = function () { setTimeout(function () { res(f); }, 900); }; f.onerror = function () { res(null); }; document.body.appendChild(f); setTimeout(function () { res(f); }, 9000);
    });
  }
  const sel1 = function (d, s) { return d.querySelector(s); };
  test("Симуляція, комп'ютер (1500 px): ліворуч поточні розділи (≈65 %), праворуч стрічка (≈35 %) з незалежною прокруткою; розділи й їхні вузли збережені", async function () {

      const d = f.contentDocument; if (!d || !d.querySelector(".lf")) throw new Skip("сторінка не завантажилась");
      const w = f.contentWindow, main = sel1(d, ".sim-main"), side = sel1(d, ".sim-side");
      ["paper", "history", "testnet", "simAgent"].forEach(function (id) { assert(main.contains(d.getElementById(id)), "розділ #" + id + " у лівій колонці"); });
      const mw = main.getBoundingClientRect().width, sw = side.getBoundingClientRect().width, share = sw / (mw + sw); assert(share > 0.31 && share < 0.37, "частка стрічки " + share.toFixed(3));
      eq(w.getComputedStyle(sel1(d, ".lf-list")).overflowY, "auto", "незалежна прокрутка"); assert(!sel1(d, ".sim-events-bar").classList.contains("on") && w.getComputedStyle(sel1(d, ".lf-fab")).display === "none", "кнопки «Події» вгорі на широкому екрані немає");
      assert(sel1(d, ".sim-scope") && sel1(d, ".lf") && sel1(d, ".sim-scope").parentNode === sel1(d, ".lf"), "блок звуження всередині панелі");
      const before = main.getBoundingClientRect().width; sel1(d, ".lf-collapse").click(); await sleep(150); assert(main.getBoundingClientRect().width > before * 1.4, "робоча область розширилась: " + before + " → " + main.getBoundingClientRect().width); sel1(d, ".lf-reopen").click(); await sleep(100);
      eq(d.querySelectorAll(".lf").length, 1, "одна панель; другої системи подій немає"); eq(d.querySelectorAll(".lf-fab").length, 1);
    } finally { f && f.remove(); }

  test("Симуляція: «лише цей гаманець» і «лише цей бот» звужують стрічку за вибором на сторінці без дублювання; за замовчуванням показано все", async function () {
    const f = await frame("simulation.html", 1500); try {

      pick(1000, "trend_1h"); await sleep(50); assert(/1\s?000/.test(bw.textContent) && /Лише бот/.test(bb.textContent), "підписи кнопок: " + bw.textContent + " | " + bb.textContent);

      bb.click(); await sleep(60); eq(d.querySelector(".lf-select[aria-label='Бот']").value, "trend_1h");
      pick(100, "setup_live"); await sleep(60); eq(d.querySelector(".lf-select[aria-label='Гаманець']").value, "100", "слідує за перемиканням гаманця"); eq(d.querySelector(".lf-select[aria-label='Бот']").value, "setup_live", "слідує за перемиканням бота");
      const n = d.querySelectorAll(".lf-card").length; pick(100, "setup_live"); pick(100, "setup_live"); await sleep(60); eq(d.querySelectorAll(".lf-card").length, n, "повторний вибір не дублює картки");

  test("Симуляція, вужчий екран (1100 px): таблиці не стискаються, угорі кнопка «Події» відкриває висувне вікно", async function () {

  test("Очищення: знищення панелі прибирає кнопку, клас режиму й слухачів медіа-запиту; повторне монтування не дублює", async function () {

    for (let i = 0; i < 4; i++) { const inst = LiveFeed.mount(host, { env: env, layoutRoot: root, fabParent: bar, drawerBelow: 99999 }); await flush(); assert(host.classList.contains("lf-drawer") && bar.querySelectorAll(".lf-fab").length === 1, "режим вікна й одна кнопка"); inst.destroy(); eq(bar.querySelectorAll(".lf-fab").length, 0); assert(!host.classList.contains("lf-drawer") && !root.classList.contains("lf-drawer-root"), "класи прибрано"); }

  // =============== Запуск ===============
  async function run() {
    for (const item of queue) {
      if (item.group) { section = document.createElement("div"); const h = document.createElement("h2"); h.textContent = item.group; section.appendChild(h); section.appendChild(document.createElement("ul")); out.appendChild(section); continue; }
      const li = document.createElement("li");
      try { await item.fn(); pass++; li.className = "ok"; li.textContent = "✓ " + item.name; cleanupUI(); }
      catch (e) {
        cleanupUI();
        if (e instanceof Skip) { skipped++; li.className = "note"; li.textContent = "○ " + item.name + " — пропущено: " + e.message; }
        else { fail++; li.className = "fail"; li.textContent = "✗ " + item.name + " — " + (e && e.message ? e.message : e); }
      }
      section.querySelector("ul").appendChild(li);
    }
    const total = pass + fail, s = document.getElementById("sum");
    s.textContent = (fail ? "Провалено: " + fail + " із " + total : "Усі тести пройдено: " + pass + " із " + total) + (skipped ? " (пропущено: " + skipped + ")" : "");
    s.className = fail ? "fail" : "ok"; document.title = (fail ? "ПРОВАЛ " : "OK ") + pass + "/" + total;
    window.__testSummary = { pass: pass, fail: fail, skipped: skipped, total: total };
  }
  run();
})();
