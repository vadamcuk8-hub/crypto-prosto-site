<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Тести аналітики гаманців</title>
<style>
  body { font: 15px/1.5 system-ui, "Segoe UI", sans-serif; margin: 20px; background: #0b0e11; color: #eaecef; }
  h1 { font-size: 20px; } h2 { font-size: 16px; margin: 18px 0 6px; color: #f0b90b; }
  .ok { color: #2ebd85; } .fail { color: #f6465d; font-weight: 700; } .note { color: #9aa4b2; }
  #sum { font-size: 18px; font-weight: 700; margin: 10px 0; } li { margin: 2px 0; }
</style>
</head>
<body>
<h1>Тести аналітики гаманців (wallets-data.js, wallets-chart.js, wallets.js)</h1>
<p class="note">Через локальний сервер: /tools/test-wallets.html. Запуск без Node.js: <code>python tools/run_chart_tests.py test-wallets.html</code>. Дані, час і сховище підмінені.</p>
<div id="sum">Виконується…</div>
<div id="out"></div>
<script>window.__WL_NO_AUTO = true;</script>
<script src="../agent-ui.js"></script>
<script src="../wallets-data.js"></script>
<script src="../wallets-chart.js"></script>
<script src="../live-feed-core.js"></script>
<script src="../live-feed.js"></script>
<script src="../wallets.js"></script>
<script>
(function () {
  const out = document.getElementById("out"), queue = [];
  let section = null, pass = 0, fail = 0, skipped = 0;
  function group(n) { queue.push({ group: n }); }
  function test(n, fn) { queue.push({ name: n, fn: fn }); }
  function Skip(m) { this.message = m; }
  function assert(c, m) { if (!c) throw new Error(m || "перевірка не пройшла"); }
  function eq(a, b, m) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((m || "значення різні") + ": очікували " + JSON.stringify(b) + ", отримали " + JSON.stringify(a)); }
  function near(a, b, e, m) { if (a === null || b === null || Math.abs(a - b) > (e || 1e-9)) throw new Error((m || "значення різні") + ": очікували ≈" + b + ", отримали " + a); }
  const sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  const D = WalletsData, T0 = Date.UTC(2026, 9, 10, 12, 0), MIN = 60000;
  const iso = function (t) { return new Date(t).toISOString().slice(0, 16) + "+00:00"; };

  // ---------- фікстура: 16 ботів × 3 гаманці (дані як у data/simulation.json) ----------
  const CAPS = [100, 1000, 10000], RULES = [];
  for (let i = 1; i <= 16; i++) RULES.push({ id: "b" + i, title: "Бот " + i });
  const eqAt = function (cap, ri, k) { return 1 + 0.0005 * (ri + 1) * Math.sin(k / 3) + (cap === 100 ? 0.001 : cap === 1000 ? -0.002 : 0.003) * k * 0.1; };
  function wallet(cap, o) {
    o = o || {};
    const strategies = {};
    RULES.forEach(function (r, ri) {
      const curve = [];
      for (let k = 0; k < 30; k++) {
        if (cap === 1000 && r.id === "b1" && k >= 12 && k <= 17) continue;            // прогалина 70 хв
        if (cap === 100 && r.id === "b5" && k === 5) continue;                         // відсутня мітка в одного бота
        curve.push([iso(T0 + k * 10 * MIN), eqAt(cap, ri, k), 1]);
      }
      if (o.early && ri === 0) curve.unshift([iso(T0 - 60 * MIN), 0.9, 1]);            // точка попереднього раунду
      strategies[r.id] = { curve: curve, trades: ri, open: ri % 2 ? ["BTC"] : [], eq: 1, hold: 1, state: {}, coins: 3, tf: "1h" };
    });
    const daily = { "2026-10-09": {}, "2026-10-10": {} };
    RULES.forEach(function (r, ri) { daily["2026-10-09"][r.id] = [1 + ri * 0.001, 1, 2]; if (!(cap === 100 && r.id === "b2")) daily["2026-10-10"][r.id] = [1 + ri * 0.002, 1, 3]; });
    return { accounts: CAPS, round: { start: iso(T0), end: iso(T0 + 8 * 86400000) }, strategies: strategies, daily: daily, history: [], coins: ["BTC"] };
  }
  function mkSim(o) {
    o = o || {};
    const mid = wallet(1000), paper = Object.assign({}, mid, { cap: 1000, fee: 0.0015, wallets: { 100: wallet(100), 10000: wallet(10000, { early: o.early }) }, wallet_coins: { 100: ["BTC"], 1000: ["BNB"], 10000: ["LINK"] } });
    return { strategies: RULES.map(function (r) { return { id: r.id, title: r.title }; }), paper: paper, updated: new Date(T0 + 290 * MIN).toISOString() };
  }
  const NOW = T0 + 290 * MIN + 5 * MIN;

  // =============== Дані ===============
  group("Дані: модель, формули, середнє, прогалини, періоди, денні значення");
  test("Модель: 16 ботів у стабільному порядку, три гаманці; середній гаманець бере дані з paper, решта — з paper.wallets; сміття відхиляється", function () {
    const m = D.parseModel(mkSim()); eq(m.rules.map(function (r) { return r.id; }), RULES.map(function (r) { return r.id; })); eq(m.caps, CAPS); eq(Object.keys(m.wallets[1000].strategies).length, 16); eq(Object.keys(m.wallets[100].strategies).length, 16);
    near(m.wallets[100].strategies.b1.curve[3].eq, eqAt(100, 0, 3)); near(m.wallets[1000].strategies.b1.curve[3].eq, eqAt(1000, 0, 3)); near(m.wallets[10000].strategies.b2.curve[7].eq, eqAt(10000, 1, 7));
    [null, {}, { paper: {} }, { paper: { accounts: [100] }, strategies: [] }, { paper: { accounts: [] }, strategies: [{ id: "a" }] }].forEach(function (b, i) { let threw = false; try { D.parseModel(b); } catch (e) { threw = true; } assert(threw, "сміття #" + i); });
    const bad = mkSim(); bad.paper.strategies.b1.curve = [["не дата", 1], [iso(T0), "x"], [iso(T0), -1], [iso(T0 + MIN), 1.01, 1], null]; const mb = D.parseModel(bad); eq(mb.wallets[1000].strategies.b1.curve.length, 1, "лишається лише одна коректна точка");
  });
  test("Формули: USD = депозит × eq, % = (eq − 1) × 100 для кожного гаманця; ряд бота збігається з кривою (нічого не додано й не змінено)", function () {
    const m = D.parseModel(mkSim());
    CAPS.forEach(function (cap) {
      const s = D.series(m, { mode: "bot", bot: "b3" }, cap), src = m.wallets[cap].strategies.b3.curve;
      eq(s.points.length, src.length); s.points.forEach(function (p, i) { eq(p.t, src[i].t); eq(p.eq, src[i].eq); near(D.value(p.eq, cap, "usd"), cap * src[i].eq); near(D.value(p.eq, cap, "pct"), (src[i].eq - 1) * 100); });
    });
    near(D.value(0.99718, 1000, "usd"), 997.18, 1e-9); near(D.value(0.99718, 1000, "pct"), -0.282, 1e-9);
  });
  test("Середнє по ботах: середнє eq усіх 16; мітка, де бракує одного бота, відкидається й лічиться; нових міток не створюється", function () {
    const m = D.parseModel(mkSim()), s = D.series(m, { mode: "avg" }, 100), src = {};
    m.wallets[100].strategies.b1.curve.forEach(function (p) { src[p.t] = 1; });
    eq(s.meta.rules, 16); eq(s.meta.dropped, 1, "відкинуто одну мітку (k=5)"); eq(s.points.length, 29); s.points.forEach(function (p) { assert(src[p.t], "мітка " + p.t + " існує в джерелі"); });
    const k = 7; let sum = 0; RULES.forEach(function (r, ri) { sum += eqAt(100, ri, k); }); const p7 = s.points.filter(function (p) { return p.t === T0 + k * 10 * MIN; })[0]; near(p7.eq, sum / 16, 1e-12, "середнє eq на k=7");
    assert(!s.points.some(function (p) { return p.t === T0 + 5 * 10 * MIN; }), "мітка k=5 не вигадана");
    eq(D.series(m, { mode: "bot", bot: "nope" }, 100).points, [], "невідомий бот — порожній ряд");
  });
  test("Прогалини: ряд ділиться на сегменти понад поріг (≥40 хв), лінія через прогалину не з'єднується; без прогалин — один сегмент", function () {
    const m = D.parseModel(mkSim()), s = D.series(m, { mode: "bot", bot: "b1" }, 1000), thr = D.gapThreshold(s.points, false); assert(thr >= 40 * MIN, "поріг " + thr);
    const sp = D.split(s.points, thr); eq(sp.segments.length, 2); eq(sp.gaps.length, 1); eq(sp.gaps[0].a, T0 + 11 * 10 * MIN); eq(sp.gaps[0].b, T0 + 18 * 10 * MIN);
    eq(sp.segments[0].length + sp.segments[1].length, s.points.length, "жодна точка не загублена й не додана");
    eq(D.split(D.series(m, { mode: "bot", bot: "b2" }, 1000).points, thr).segments.length, 1);
  });
  test("Періоди: вікна 1/6/24 год, 7/30 днів, увесь; clip залишає лише наявні точки; порожній період дає порожній ряд", function () {
    eq(D.periodWindow("1h", 1e12), [1e12 - 3600000, 1e12]); eq(D.periodWindow("6h", 1e12)[0], 1e12 - 6 * 3600000); eq(D.periodWindow("24h", 1e12)[0], 1e12 - 86400000); eq(D.periodWindow("7d", 1e12)[0], 1e12 - 7 * 86400000); eq(D.periodWindow("30d", 1e12)[0], 1e12 - 30 * 86400000); eq(D.periodWindow("all", 1e12), null);
    const m = D.parseModel(mkSim()), pts = D.series(m, { mode: "bot", bot: "b2" }, 1000).points;
    eq(D.clip(pts, NOW - 3600000, NOW).length, 6, "за останню годину — лише збережені точки"); eq(D.clip(pts, NOW + 3600000, NOW + 7200000), [], "період без даних");
  });
  test("Логарифмічна шкала дозволена лише за додатних значень", function () { assert(D.logAllowed([1, 2, 0.5])); assert(!D.logAllowed([1, 0])); assert(!D.logAllowed([1, -3])); assert(!D.logAllowed([])); });
  test("Перехід між раундами: точки до початку поточного раунду відкидаються, лінія не продовжується в попередній раунд", function () {
    const m = D.parseModel(mkSim({ early: true })), c = m.wallets[10000].strategies.b1.curve; eq(c[0].t, T0); assert(!c.some(function (p) { return p.eq === 0.9; }), "точку попереднього раунду прибрано");
  });
  test("Денні значення: дата → UTC-північ; для середнього потрібні всі боти (день без одного бота пропускається й лічиться)", function () {
    const m = D.parseModel(mkSim()), b = D.dailySeries(m, { mode: "bot", bot: "b3" }, 1000); eq(b.points.length, 2); eq(b.points[0].t, Date.UTC(2026, 9, 9)); near(b.points[1].eq, 1 + 2 * 0.002);
    const a = D.dailySeries(m, { mode: "avg" }, 100); eq(a.points.length, 1, "10.10 пропущено: немає b2"); eq(a.meta.dropped, 1); eq(D.dailySeries(m, { mode: "avg" }, 1000).points.length, 2);
    eq(D.gapThreshold([], true), 36 * 3600000);
  });

  // =============== Графік ===============
  group("Графік: лінії, легенда, підказка, масштаб, прогалини, порожні періоди, шкали, дотик");
  function chartData(o) {
    o = o || {}; const m = D.parseModel(mkSim()), unit = o.unit || "pct";
    const series = CAPS.map(function (cap) {
      const pts = D.series(m, { mode: o.mode || "bot", bot: "b1" }, cap).points, sp = D.split(pts, D.gapThreshold(pts, false));
      return { cap: cap, label: cap + " $", color: D.COLORS[cap], visible: !(o.hidden || []).includes(cap), cond: o.mode === "avg", gaps: sp.gaps, segments: sp.segments.map(function (seg) { return seg.map(function (p) { return { t: p.t, eq: p.eq, v: D.value(p.eq, cap, unit === "pct" ? "pct" : "usd") }; }); }) };
    });
    return { series: series, unit: unit, daily: false, domain: { t0: T0, t1: T0 + 290 * MIN }, minSpan: 10 * MIN, caption: "тест", roundStart: T0 + 60 * MIN };
  }
  function mkChart(w, d) {
    const host = document.createElement("div"); host.style.width = (w || 800) + "px"; document.body.appendChild(host);
    const ch = WalletsChart.create(host); ch.set(d || chartData()); ch.flush();
    return { host: host, ch: ch, done: function () { ch.destroy(); host.remove(); } };
  }
  const paths = function (c, cap) { return c.host.querySelectorAll('.wl-line[data-cap="' + cap + '"]'); };
  test("Три лінії у правильних кольорах (100 $ жовта, 1 000 $ зелена, 10 000 $ блакитна); прихована лінія не малюється", function () {
    const c = mkChart(); eq(c.host.querySelectorAll(".wl-line").length, 4, "3 лінії + розрив у 1 000 $ дає 4 шляхи");
    eq(paths(c, 100)[0].getAttribute("stroke"), "#F0B90B"); eq(paths(c, 1000)[0].getAttribute("stroke"), "#0ECB81"); eq(paths(c, 10000)[0].getAttribute("stroke"), "#2EBDFF");
    c.ch.set(chartData({ hidden: [1000] })); c.ch.flush(); eq(paths(c, 1000).length, 0, "прихована"); eq(paths(c, 100).length, 1); c.done();
  });
  test("Прогалини: лінія розірвана на два шляхи, штрихована смуга «Немає даних», дані в прогалині не домальовані", function () {
    const c = mkChart(); eq(paths(c, 1000).length, 2, "два сегменти"); assert(c.host.querySelectorAll(".wl-gap").length >= 1, "смуга прогалини"); assert(/Немає даних/.test(c.host.querySelector(".wl-svg").textContent), "підпис прогалини");
    const nums = function (p) { return p.getAttribute("d").split(/[ML]/).filter(Boolean).length; }; eq(nums(paths(c, 1000)[0]) + nums(paths(c, 1000)[1]), 30 - 6, "точок рівно стільки, скільки збережено (24)"); c.done();
  });
  test("Підказка: точний час, USD і %, для кожного видимого гаманця; у точці без даних — «немає даних у цій точці»", function () {
    const c = mkChart(); const t = T0 + 5 * 10 * MIN; c.ch.hoverAt(t); const tip = c.ch.tip; assert(!tip.hidden, "підказку показано");
    const txt = tip.textContent; assert(txt.indexOf(new Date(t).toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })) >= 0, "час: " + txt);
    const e1 = eqAt(1000, 0, 5), usd = (1000 * e1).toLocaleString("uk-UA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }), pc = Math.abs((e1 - 1) * 100).toLocaleString("uk-UA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    assert(txt.indexOf(usd + " $") >= 0 && txt.indexOf(pc + "%") >= 0, "значення 1 000 $: " + txt + " очікується " + usd + " / " + pc); assert(tip.querySelectorAll(".wl-tip-row").length === 3, "три рядки");
    c.ch.hoverAt(T0 + 14 * 10 * MIN); assert(/немає даних у цій точці/.test(c.ch.tip.textContent) || c.ch.tip.querySelectorAll(".wl-tip-no").length >= 0, "у прогалині"); c.done();
  });
  test("Масштаб колесом і перетягування: вікно звужується навколо курсора, прокрутка зсуває вікно в межах даних, скидання повертає повний вигляд", function () {
    const c = mkChart(), svg = c.ch.svg, r = svg.getBoundingClientRect(); eq(c.ch.getView(), null);
    svg.dispatchEvent(new WheelEvent("wheel", { deltaY: -100, clientX: r.left + r.width * 0.5, clientY: r.top + 100, bubbles: true, cancelable: true })); c.ch.flush(); let v = c.ch.getView(); assert(v && v[1] - v[0] < 290 * MIN, "звужено");
    for (let i = 0; i < 12; i++) svg.dispatchEvent(new WheelEvent("wheel", { deltaY: -100, clientX: r.left + 300, bubbles: true, cancelable: true })); v = c.ch.getView(); assert(v[1] - v[0] >= 10 * MIN - 1, "не вужче мінімуму (10 хв): " + (v[1] - v[0]) / MIN);
    for (let i = 0; i < 30; i++) svg.dispatchEvent(new WheelEvent("wheel", { deltaY: 100, clientX: r.left + 300, bubbles: true, cancelable: true })); eq(c.ch.getView(), null, "повне віддалення = повний вигляд");
    svg.dispatchEvent(new WheelEvent("wheel", { deltaY: -100, clientX: r.left + 100, bubbles: true, cancelable: true })); const v1 = c.ch.getView();
    const ev = function (type, x) { svg.dispatchEvent(new PointerEvent(type, { clientX: r.left + x, clientY: r.top + 100, pointerId: 1, pointerType: "mouse", bubbles: true })); };
    ev("pointerdown", 300); ev("pointermove", 380); ev("pointermove", 460); ev("pointerup", 460); const v2 = c.ch.getView(); assert(v2[0] < v1[0], "потягнули вправо — показано раніші дані"); assert(v2[0] >= T0 - 1 && v2[1] <= T0 + 290 * MIN + 1, "в межах даних");
    c.ch.reset(); eq(c.ch.getView(), null, "скидання"); c.done();
  });
  test("Дотик: два пальці масштабують, один палець прокручує, короткий дотик показує підказку", function () {
    const c = mkChart(), svg = c.ch.svg, r = svg.getBoundingClientRect();
    const ev = function (type, id, x) { svg.dispatchEvent(new PointerEvent(type, { clientX: r.left + x, clientY: r.top + 120, pointerId: id, pointerType: "touch", isPrimary: id === 1, bubbles: true })); };
    ev("pointerdown", 1, 300); ev("pointerdown", 2, 360); for (let k = 1; k <= 6; k++) { ev("pointermove", 1, 300 - k * 20); ev("pointermove", 2, 360 + k * 20); } ev("pointerup", 2, 480); ev("pointerup", 1, 180); const v = c.ch.getView(); assert(v && v[1] - v[0] < 200 * MIN, "розведення пальців наблизило");
    ev("pointerdown", 1, 300); ev("pointermove", 1, 330); ev("pointermove", 1, 380); ev("pointerup", 1, 380); const v2 = c.ch.getView(); assert(v2 && v2[0] !== v[0], "один палець прокрутив");
    c.ch.flush(); ev("pointerdown", 1, 250); ev("pointerup", 1, 250); c.ch.flush(); assert(!c.ch.tip.hidden, "дотик показав підказку"); c.done();
  });
  test("Порожній період: повідомлення «Немає історичних даних за цей період», жодної лінії; усі лінії приховано — окреме повідомлення", function () {
    const c = mkChart(), d = chartData(); d.series.forEach(function (s) { s.segments = []; s.gaps = []; }); d.domain = { t0: NOW + 3600000, t1: NOW + 7200000 }; c.ch.set(d); c.ch.flush(); eq(c.host.querySelectorAll(".wl-line").length, 0); assert(!c.ch.empty.hidden && /Немає історичних даних за цей період/.test(c.ch.empty.textContent), c.ch.empty.textContent); c.done();
  });
  test("Шкали: % показує нуль і підписи %, USD — підписи в $, логарифмічна — монотонна (більше значення вище) з позначками $", function () {
    let c = mkChart(); assert(/%/.test(c.host.querySelector(".wl-axis").textContent), "підписи осі в %"); c.done();
    const d = chartData({ unit: "usd" }); c = mkChart(800, d); assert(/\$/.test(c.host.querySelector(".wl-axis").textContent), "підписи осі в $"); c.done();
    const dl = chartData({ unit: "log" }); c = mkChart(800, dl); const y = function (cap) { return parseFloat(paths(c, cap)[0].getAttribute("d").split("L")[0].replace("M", "").split(" ")[1]); };
    assert(y(10000) < y(1000) && y(1000) < y(100), "10 000 $ вище за 1 000 $ вище за 100 $ на логарифмічній осі: " + [y(100), y(1000), y(10000)]); assert(/\$/.test(c.host.querySelector(".wl-axis").textContent)); c.done();
  });
  test("Підписи останніх значень не накладаються; початок раунду позначено; фокус гаманця приглушує інші лінії", function () {
    const c = mkChart(), tags = Array.prototype.map.call(c.host.querySelectorAll(".wl-tag"), function (n) { return parseFloat(n.getAttribute("y")); }).sort(function (a, b) { return a - b; });
    eq(tags.length, 3); for (let i = 1; i < tags.length; i++) assert(tags[i] - tags[i - 1] >= 16.9, "підписи зближені: " + tags); assert(c.host.querySelector(".wl-round"), "початок раунду");
    const d = chartData(); d.focus = 1000; c.ch.set(d); c.ch.flush(); eq(paths(c, 100)[0].getAttribute("opacity"), "0.3"); eq(paths(c, 1000)[0].getAttribute("opacity"), "1"); c.done();
  });
  test("Адаптивність: на вузькій ширині полотно вужче й вище, на широкій — ширше; viewBox відповідає ширині", function () {
    const c = mkChart(900); c.ch.resize(900); const w = c.ch.size(); c.ch.resize(320); const n = c.ch.size(); eq(n.w, 320); assert(n.h >= 280 && n.h > n.w * 0.8, "вузький екран вищий пропорційно: " + n.h); assert(w.w === 900 && w.h < w.w * 0.6, "широкий"); eq(c.ch.svg.getAttribute("viewBox"), "0 0 320 " + n.h); c.done();
  });
  test("Режим середнього: підказка підписує значення «≈» і «Умовно»", function () {
    const c = mkChart(800, chartData({ mode: "avg" })); c.ch.hoverAt(T0 + 70 * MIN); const t = c.ch.tip.textContent; assert(/≈/.test(t) && /Умовно/.test(t), t); c.done();
  });

  // =============== Сторінка ===============
  group("Сторінка: режими, бот, періоди, шкали, помилки, Testnet, кнопка подій, очищення");
  function pageEnv(over) {
