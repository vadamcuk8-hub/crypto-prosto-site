<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Допоміжна сторінка тестів аналітики гаманців</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="page-wallets">
<!-- Лише для tools/test-wallets.html: справжні стилі сайту + вигадані тестові дані (не публікується: папка tools виключена зі збірки сайту) -->
<main id="wlRoot" class="wl-root"></main>
<script>window.__WL_NO_AUTO = true; window.__errs = []; window.addEventListener("error", function (e) { window.__errs.push(e.message); });</script>
<script src="../agent-ui.js"></script>
<script src="../wallets-data.js"></script>
<script src="../wallets-chart.js"></script>
<script src="../wallets.js"></script>
<script>
(function () {
  var MIN = 60000, T0 = Date.UTC(2026, 9, 10, 12, 0), CAPS = [100, 1000, 10000], RULES = [];
  for (var i = 1; i <= 16; i++) RULES.push({ id: "b" + i, title: "Бот " + i });
  function iso(t) { return new Date(t).toISOString().slice(0, 16) + "+00:00"; }
  function eqAt(cap, ri, k) { return 1 + 0.0005 * (ri + 1) * Math.sin(k / 3) + (cap === 100 ? 0.001 : cap === 1000 ? -0.002 : 0.003) * k * 0.1; }
  function wallet(cap) {
    var st = {};
    RULES.forEach(function (r, ri) { var c = []; for (var k = 0; k < 30; k++) { if (cap === 1000 && r.id === "b1" && k >= 12 && k <= 17) continue; c.push([iso(T0 + k * 10 * MIN), eqAt(cap, ri, k), 1]); } st[r.id] = { curve: c, trades: ri, open: ri % 2 ? ["BTC"] : [], state: ri === 0 ? { BTC: [1, 1.02, 1, 100, 0.5], ETH: [0, 0.99, 1, 50, 0.5] } : {} }; });
    return { accounts: CAPS, round: { start: iso(T0), end: iso(T0 + 8 * 86400000) }, strategies: st, daily: {}, history: [], coins: ["BTC"] };
  }
  var mid = wallet(1000), paper = Object.assign({}, mid, { cap: 1000, fee: 0.0015, wallets: { 100: wallet(100), 10000: wallet(10000) }, wallet_coins: { 100: ["BTC", "ETH", "SOL"], 1000: ["BNB", "XRP", "ADA", "DOGE"], 10000: ["LINK", "AVAX", "SUI"] } });
  var sim = { strategies: RULES.map(function (r) { return { id: r.id, title: r.title }; }), paper: paper, updated: new Date(T0 + 290 * MIN).toISOString() };
  var NOW = T0 + 295 * MIN;
  // фальшивий архів Paper Trading: покупки/продажі з виконанням Stop Loss / Take Profit (для перевірки мобільного вигляду історії)
  var ARCH = [];
  (function () { var n = 1; function a(min, w, bot, type, coin, price, eq, ex, xi) { var e = { id: "sim-" + ("0000000000000000" + (n++).toString(16)).slice(-16), t: T0 + min * MIN, candle: 1000 + min, wallet: w, bot: bot, coin: coin, type: type, price: price, eq: eq, w: 0.25, cost: 0.0015 }; if (ex) e.exit = ex; if (xi) e.exit_info = xi; ARCH.push(e); }
    for (var k = 0; k < 6; k++) { var m = 20 + k * 40; a(m, 1000, "b2", "open", "BNB", 100 + k, 1.0); a(m + 20, 1000, "b2", "close", "BNB", 101 + k, 1.0 + 0.002 * k, k % 2 ? "take" : "stop", { kind: k % 2 ? "take" : "stop", threshold_pct: k % 2 ? 4 : 2, entry: 100 + k, exit_price: 101 + k, move_pct: k % 2 ? 4.1 : -2.4, check: "software" }); }
    a(30, 100, "b3", "close", "BTC", 60000, 1.01, "stop", { kind: "stop", threshold_pct: 1.5, entry: 61000, exit_price: 60000, move_pct: -1.64, check: "software" }); ARCH.sort(function (x, y) { return x.t - y.t; }); })();
  WalletsPage.mount(document.getElementById("wlRoot"), { feed: false, refreshMs: 1e9, priceMs: 1e9, now: function () { return NOW; }, storage: { getItem: function () { return null; }, setItem: function () {} },
    loadJson: function (u) {
      if (/trader/.test(u)) return Promise.resolve({ configured: false });
      if (/simulation\.json/.test(u)) return Promise.resolve(sim);
      if (/live_feed/.test(u)) return Promise.resolve({ v: 1, events: [], open: [{ pos: "p1", wallet: 1000, bot: "b1", coin: "BTC", entry: 100, entry_t: T0 }] });
      if (/paper_events\.json/.test(u)) return Promise.resolve({ b2: [{ at: iso(T0 + 20 * MIN), candle: 1, coin: "BNB", side: "BUY", price: 100, w: 0.25, eq: 1, cost: 0.0015, reason: "тест" }, { at: iso(T0 + 50 * MIN), candle: 2, coin: "BNB", side: "SELL", price: 101, w: 0.25, eq: 1.0068, cost: 0.0015, exit: "take", reason: "тест" }] });
      if (/paper_archive\/index\.json/.test(u)) return Promise.resolve({ v: 1, updated: iso(NOW), segments: [{ name: "2026-10", count: ARCH.length, bytes: 4000, first_t: ARCH[0].t, last_t: ARCH[ARCH.length - 1].t }] });
      if (/paper_archive\/2026-10\.json/.test(u)) return Promise.resolve({ v: 1, month: "2026-10", count: ARCH.length, events: ARCH });
      return Promise.reject(new Error("404"));
    }, loadPrices: function () { return Promise.resolve({ BTC: 110 }); } });
})();
</script>
</body>
</html>
